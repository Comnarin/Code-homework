# Prometheus for the "observability" compose profile.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: foodstore-api
    static_configs:
      # The API serves /metrics on its own internal port; it is not published
      # on the host and not available on the public API port.
      - targets: ["api:9091"]
