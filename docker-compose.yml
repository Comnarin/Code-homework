services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-foodstore}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-foodstore}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Product pictures. Optional for the API: if this is stopped or unreachable,
  # the API serves the built-in "no image" picture and everything else works.
  minio:
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "${MINIO_API_HOST_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@postgres:5432/${POSTGRES_DB:-foodstore}?sslmode=disable
      REDIS_ADDR: redis:6379
      PORT: "8080"
      # Test aid: exposes POST /api/test/reset-limits. Keep false for production.
      ENABLE_TEST_TOOLS: ${ENABLE_TEST_TOOLS:-false}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env first}
      MINIO_BUCKET: ${MINIO_BUCKET:-product-images}
      # Redis logical database. The load-test project uses a different one.
      REDIS_DB: ${REDIS_DB:-0}
      # Prometheus metrics are served on their own port, reachable only from
      # inside the compose network (never published, never on the API port).
      METRICS_ADDR: ":9091"
      # Tracing is off unless this is set, e.g. http://jaeger:4318 (see README).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: foodstore-api
    expose:
      - "9091"
    ports:
      - "${API_HOST_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Started, not healthy: the API must come up even if MinIO is slow or broken.
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./frontend
      args:
        API_URL: http://api:8080
    environment:
      API_URL: http://api:8080
      ENABLE_TEST_TOOLS: ${ENABLE_TEST_TOOLS:-false}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # --- Optional: metrics dashboards and traces. docker compose --profile observability up -d ---
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.10.0
    ports:
      - "${JAEGER_HOST_PORT:-16686}:16686"
    expose:
      - "4318" # OTLP/HTTP, used by the api inside the compose network

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.1
    environment:
      # Demo only: anonymous admin, no login. Never expose this outside your machine.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - jaeger

  # --- Optional: load tests. Use ./loadtest/run.sh (it picks an isolated project). ---
  k6:
    profiles: [loadtest]
    image: grafana/k6:1.2.0
    environment:
      BASE_URL: http://api:8080
    volumes:
      - ./loadtest:/scripts:ro
      - ./loadtest/out:/scripts/out:rw
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
